# Release: a v* tag triggers the same build that CI verifies, then attaches the
# installers to a draft GitHub Release for human review before publishing.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build installers
    uses: ./.github/workflows/build-windows.yml

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: axiom-installers
          path: installers

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" installers/* --draft --generate-notes
