# CI: every pull request and main push runs the full verification axis on
# Windows (the only supported target), then a full package build.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (tests + gates)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      AXIOM_BUILD_USE_PYTHON: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python deps
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install -q pip-audit
        working-directory: reasonix-py

      - name: Repo gates (versions, secrets, gRPC contract)
        run: |
          python scripts/verify_versions.py
          python scripts/scan_secrets.py
          python scripts/verify_proto_contract.py

      - name: Dependency audits
        run: |
          python -m pip_audit --skip-editable
          cd desktop/python-frontend && npm audit --audit-level=moderate
          cd ../electron && npm audit --audit-level=moderate

      - name: Python tests
        run: python -m pytest -q
        working-directory: reasonix-py

      - name: Java tests
        run: .\mvnw.cmd test -q
        working-directory: reasonix-java

      - name: Frontend tests + build
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run --pool=forks --maxWorkers=1 --no-file-parallelism
          npm run build
        working-directory: desktop/python-frontend

  remote-worker:
    name: Linux remote experiment supervisor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime and test dependencies
        run: python -m pip install -e ".[dev]"
        working-directory: reasonix-py
      - name: Verify real detached jobs and cancellation
        run: |
          python -m pytest tests/integration/test_experiment_worker_linux.py -q
          python -m mypy --platform linux reasonix/experiments/worker.py
        working-directory: reasonix-py

  build:
    name: Build installers
    needs: [verify, remote-worker]
    uses: ./.github/workflows/build-windows.yml
