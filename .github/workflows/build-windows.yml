# Reusable Windows build (对标 DSH: reusable build workflow consumed by both
# CI and the release pipeline so both consume exactly the same packed bytes).
name: Build Windows package

on:
  workflow_call:
    outputs:
      installers:
        description: Newline-separated installer paths produced by build_all.ps1
        value: ${{ jobs.build.outputs.installers }}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      installers: ${{ steps.locate.outputs.installers }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install NSIS (best effort)
        shell: pwsh
        run: |
          try { choco install nsis -y --no-progress | Out-Null } catch {
            Write-Host "NSIS unavailable; the legacy installer step will be skipped"
          }

      - name: Full build
        shell: pwsh
        env:
          AXIOM_BUILD_USE_PYTHON: '1'
        run: .\build_all.ps1

      - name: Locate installers
        id: locate
        shell: pwsh
        run: |
          $electron = Get-ChildItem 'reasonix-build/desktop-electron/Axiom Setup*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          $legacy = Get-ChildItem 'reasonix-build/Axiom-windows-amd64-installer.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          $paths = @()
          if ($electron) { $paths += $electron.FullName }
          if ($legacy) { $paths += $legacy.FullName }
          if ($paths.Count -eq 0) { throw 'No installer was produced by build_all.ps1' }
          $joined = $paths -join [Environment]::NewLine
          "installers<<AXIOM_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8
          $joined | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "AXIOM_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: axiom-installers
          path: ${{ steps.locate.outputs.installers }}
          if-no-files-found: error
