[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reasonix"
version = "0.2.1"
description = "Axiom AI coding workbench (Reasonix-compatible Python engine)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.14,<2",
    "langchain-core>=1.5.0,<2",
    "langchain-openai>=1.4.0,<2",
    "langchain-anthropic>=1.5.0,<2",
    "langgraph>=1.2.9,<2",
    "langchain-mcp-adapters>=0.3.0,<1",
    "typing_extensions>=4.12,<5",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "tomli>=2.0,<3; python_version < '3.11'",
    "tomli_w>=1.0,<2",
    "httpx>=0.27,<1",
    "rich>=13.0,<15",
    "pyyaml>=6.0,<7",
    "aiofiles>=24.0,<26",
    "fastapi>=0.115,<1",
    "uvicorn>=0.29,<1",
    "sse-starlette>=2.0,<4",
    "starlette>=1.3.1,<2",
    "grpcio>=1.82.1,<2",
    "protobuf>=7.35,<8",
    "websockets>=12.0,<17",
]

[project.optional-dependencies]
desktop = [
    "websockets>=12.0,<17",
]
serve = []
windows = [
    "pywin32>=306,<400",
]
darwin = [
    "pyobjc>=10,<13",
]
dev = [
    "pytest>=8.0,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=5.0,<8",
    "mypy>=1.10,<2",
    "ruff>=0.5,<1",
    "pre-commit>=3.0,<5",
    "types-grpcio>=1.82.1.20260711,<2",
    "types-protobuf>=7.34.1.20260518,<8",
]

[project.scripts]
reasonix = "reasonix.__main__:main"
axiom = "reasonix.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["reasonix"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"reasonix/agent/compose.py" = ["E501"]
"reasonix/grpc/security_pb2.py" = ["E501", "N802"]
"reasonix/grpc/security_pb2.pyi" = ["ALL"]
"reasonix/grpc/security_pb2_grpc.py" = ["E501", "N802"]
"reasonix/guardian/guardian.py" = ["E501"]
"reasonix/serve/server.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
exclude = ["tests/", "desktop/"]

[[tool.mypy.overrides]]
module = [
    "reasonix.grpc.security_pb2",
    "reasonix.grpc.security_pb2_grpc",
]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
